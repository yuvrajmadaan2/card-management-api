spring.application.name=card-management

# H2 Database
spring.datasource.url=jdbc:h2:mem:carddb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true

# H2 Console
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH2_ISSUER_URI}
OAUTH2_ISSUER_URI=http://127.0.0.1:5556/dex

# Swagger / OpenAPI disabled by default
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false