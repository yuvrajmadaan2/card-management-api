spring.application.name=card-management

# H2 Database
spring.datasource.url=jdbc:h2:mem:carddb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.defer-datasource-initialization=true

# H2 Console
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH2_ISSUER_URI}

# Swagger / OpenAPI disabled by default
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Error response hardening
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

app.cors.allowed-origin=https://portal.partner-forex.com